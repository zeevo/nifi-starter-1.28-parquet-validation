# Single-node NiFi 1.28.1 for local extension development.
#
# The ./nars directory is mounted as NiFi's NAR autoload directory
# (nifi.nar.library.autoload.directory), so dropping a .nar in there deploys it
# without restarting the container.
#
#   mvn clean install
#   cp nifi-starter-api-nar/target/*.nar nifi-starter-nar/target/*.nar nars/
#   docker compose up -d
#
# Then open https://localhost:8443/nifi and accept the self-signed certificate.
services:
  nifi:
    image: apache/nifi:1.28.1
    container_name: nifi-starter
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      # Local-dev credentials only. Password must be at least 12 characters.
      SINGLE_USER_CREDENTIALS_USERNAME: nifi
      SINGLE_USER_CREDENTIALS_PASSWORD: nifinifinifinifi
      NIFI_SENSITIVE_PROPS_KEY: local-dev-sensitive-props-key
    volumes:
      - ./nars:/opt/nifi/nifi-current/extensions
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_logs:/opt/nifi/nifi-current/logs
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository

volumes:
  nifi_conf:
  nifi_state:
  nifi_logs:
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_content_repository:
  nifi_provenance_repository:
